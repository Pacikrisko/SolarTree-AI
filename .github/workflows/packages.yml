name: Solix installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packaging/**', 'frontend/public/client-version.json', '.github/workflows/packages.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installer
        shell: pwsh
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; Image.open('frontend/public/icon-512.png').save('packaging/windows/Solix.ico')"
          $release = Get-Content frontend/public/client-version.json -Raw | ConvertFrom-Json
          Push-Location packaging/windows
          "[assembly:System.Reflection.AssemblyVersion(`"$($release.version).$($release.minimumBuild)`")]" | Set-Content Version.cs
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.Windows.Forms.dll /win32icon:Solix.ico /out:Solix.exe .\Launcher.cs .\Version.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes }
          & $iscc "/DReleaseVersion=$($release.version)" .\Solix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Solix-Windows
          path: packaging/windows/Solix-Setup.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore configured Android signing identity
        env:
          KEYSTORE: ${{ secrets.SOLIX_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi
        shell: bash
      - name: Build APK
        run: |
          mkdir -p packaging/android/src/main/res/drawable
          cp frontend/public/icon-192.png packaging/android/src/main/res/drawable/solix.png
          gradle -p packaging/android assembleDebug
          cp packaging/android/build/outputs/apk/debug/*-debug.apk Solix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Solix-Android
          path: Solix.apk
          if-no-files-found: error


  publish:
    if: github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version frontend/public/client-version.json)
          tag="solix-$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Solix-Setup.exe dist/Solix.apk --clobber
          else
            gh release create "$tag" dist/Solix-Setup.exe dist/Solix.apk --target "$GITHUB_SHA" --title "Solix $version" --notes "Windows and Android installers" --latest
          fi

