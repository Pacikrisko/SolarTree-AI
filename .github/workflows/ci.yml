name: Test Solix
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run API tests with isolated SQLite
        run: PYTHONPATH=. pytest -q
        env:
          DEMO_MODE: 'true'
          DATABASE_URL: sqlite:///./ci_solartree.db
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build React
        run: npm run build
      - name: Test telemetry and session handling
        run: node --experimental-strip-types --test tests/*.test.mjs

  hosting:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build -t solartree-ci .
      - name: Start with a fresh PostgreSQL database
        run: |
          docker run -d --name solartree --network host \
            -e APP_ENV=production -e DEMO_MODE=false \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgresql://postgres:ci_only@127.0.0.1:5432/postgres \
            solartree-ci
          curl -fsS --retry 20 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:10000/api/health | jq -e '.ok == true and .simulation_enabled == false'
          curl -fsS http://127.0.0.1:10000/ | grep -q 'id="root"'
          docker exec solartree python provision_device.py --help
      - name: Exercise the production UI in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright-core@1.56.1 --no-audit --no-fund
          export BROWSER_MODULE="$RUNNER_TEMP/browser/node_modules/playwright-core"
          export CHROME_PATH="$(command -v google-chrome)"
          export TEST_CLAIM="$(docker exec solartree python provision_device.py --code CI-TREE --model ST-URBAN-2KW --kind private | sed -n 's/^Pairing QR contents: STREE1|CI-TREE|//p')"
          node frontend/tests/browser-smoke.cjs
      - name: Show startup logs on failure
        if: failure()
        run: docker logs solartree || true
